name: AI ANALYZER
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Instalacja bibliotek
        run: pip install requests google-generativeai
      - name: Uruchomienie skryptu
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python ai_script.py
      - name: Commit zmian
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "AI Update"
          file_pattern: 'zmiany_prawne.json'
